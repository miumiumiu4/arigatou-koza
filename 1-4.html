<title>1-4 よくある悩み | ありがとうグループ講座</title>
<style>:root{--bg:#fbf8f3;--fg:#2b2622;--muted:#6f655b;--card:#fff;--line:#e6ddd0;--accent:#c4692b;--accent-fg:#fff;--t1:#3c8a5a;--t2:#2f6fa8;--t3:#a5502e;--mark:#fff1c2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a17;--fg:#efe9e1;--muted:#a79d90;--card:#26221e;--line:#3a342e;--accent:#e08a4a;--accent-fg:#1d1a17;--t1:#6fc28f;--t2:#79b0e3;--t3:#e38b69;--mark:#4a3e14}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.85;font-size:17px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);font-weight:700}
.top a{color:var(--fg);text-decoration:none}
main{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.55rem;line-height:1.4;margin:.4em 0 .5em}
h2{font-size:1.2rem;margin:1.6em 0 .6em;line-height:1.5}
h3{font-size:1.02rem;margin:1.4em 0 .4em;color:var(--accent)}
p{margin:.8em 0}
a{color:var(--accent)}
.lead{color:var(--muted)}
.crumb{font-size:.85rem;color:var(--muted);margin:0}
.crumb a{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;margin:18px 0}
.card h2{margin-top:.8em}
.hint{font-size:.85rem;color:var(--muted)}
.msg{min-height:1.4em;font-size:.9rem;color:var(--accent)}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;max-width:320px}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
form label{flex:1 1 220px;margin:0}
#logout{background:transparent;color:var(--muted);border:1px solid var(--line);font-size:.8rem;padding:6px 10px}
form label{display:block;font-size:.9rem;margin-bottom:6px}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 18px 18px;margin-top:12px}
.need{margin:.6em 0}
.legend{list-style:none;padding:0;margin:.4em 0}
.legend li{margin:.4em 0}
.tier{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.legend .tier{margin-left:0}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}
.howto{background:var(--mark);border-radius:10px;padding:10px 14px;font-size:.92rem}
.chap{margin:26px 0;padding-top:4px;border-top:1px solid var(--line)}
.chap h2{margin:.7em 0 .2em}
.chap .lock{margin-left:6px;font-size:.9rem}
.aim{color:var(--muted);font-size:.9rem;margin:.1em 0 .6em}
.lessons{list-style:none;margin:0;padding:0}
.lessons a{display:grid;grid-template-columns:3.2em 1fr;gap:0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card);color:var(--fg);text-decoration:none}
.lid{font-weight:700;color:var(--accent);grid-row:1/3}
.lm{font-size:.78rem;color:var(--muted)}
.chap:not(.open) .lessons a{opacity:.78}
.badges{margin:.2em 0 1em}
.badge{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin-right:6px;color:var(--muted)}
.layer-base{border-color:var(--t1);color:var(--t1)}.layer-deep{border-color:var(--t2);color:var(--t2)}
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:14px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.soon{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:var(--card);border:1px dashed var(--line);color:var(--muted);aspect-ratio:auto;min-height:120px}
.point{border-left:4px solid var(--accent)}
.point ul{padding-left:1.2em}
.script p{margin:.9em 0}
mark.todo{background:var(--mark);color:inherit;border-radius:4px;padding:0 4px}
blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--line);color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;font-size:.9rem}
.pager a{max-width:48%}
</style></head>

  function savePw(pw) { try { var a = getPws().filter(function (x) { return x !== pw; }); a.unshift(pw); localStorage.setItem(KEY, JSON.stringify(a.slice(0, 5))); } catch (e) {} }
  function clearPws() { try { localStorage.removeItem(KEY); } catch (e) {} }

  async function derive(pw, salt, iter) {
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(salt), iterations: iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  // ページ本文を開く。パスワードが合えば本文(文字列)、違えば null
  async function openPage(pw, d) {
    var k = await derive(pw, d.salt, d.iter);
    for (var i = 0; i < d.wraps.length; i++) {
      try {
        var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.wraps[i].iv) }, k, b64(d.wraps[i].ct));
        var ck = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, ck, b64(d.ct));
        return dec.decode(pt);
      } catch (e) { /* 次の包みを試す */ }
    }
    return null;
  }
  // 段階の札を開く。合えば段階の番号、違えば 0
  async function checkTier(pw, checks) {
    var best = 0;
    for (var i = 0; i < checks.length; i++) {
      var c = checks[i];
      try {
        var k = await derive(pw, c.salt, c.iter);
        var pt = dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(c.iv) }, k, b64(c.ct)));
        if (pt === 'ok:' + c.tier) best = Math.max(best, c.tier);
      } catch (e) {}
    }
    return best;
  }

  window.AkozaPage = function (payloadText) {
    var d = JSON.parse(payloadText);
    var form = document.getElementById('pwform'), input = document.getElementById('pw'), msg = document.getElementById('msg');
    var lock = document.getElementById('lock'), content = document.getElementById('content');
    function show(html) {
      content.innerHTML = html; content.hidden = false; lock.hidden = true;
      window.scrollTo(0, 0);
    }
    async function tryAll(list) {
      for (var i = 0; i < list.length; i++) {
        var r = await openPage(list[i], d);
        if (r !== null) { savePw(list[i]); show(r); return true; }
      }
      return false;
    }
    tryAll(getPws());
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msg.textContent = '確認しています…';
      var ok = await tryAll([input.value.trim()]);
      if (!ok) { msg.textContent = 'このパスワードでは開けません。段階が違うか、入力のまちがいかもしれません。'; }
    });
  };

  window.AkozaIndex = function (checksText) {
    var checks = JSON.parse(checksText);
    var form = document.getElementById('pwform'), input = document.getElementById('pw'), msg = document.getElementById('msg');
    var logout = document.getElementById('logout'), box = document.getElementById('loginbox');
    function apply(tier) {
      document.querySelectorAll('.chap').forEach(function (el) {
        var need = Number(el.getAttribute('data-tier'));
        var open = tier >= need;
        el.classList.toggle('open', open);
        el.querySelector('.lock').textContent = open ? '' : '🔒';
      });
      logout.hidden = tier === 0;
      if (tier > 0) { msg.textContent = ''; }
    }
    async function tryAll(list) {
      var best = 0;
      for (var i = 0; i < list.length; i++) {
        var t = await checkTier(list[i], checks);
        if (t > 0) { savePw(list[i]); best = Math.max(best, t); }
      }
      return best;
    }
    tryAll(getPws()).then(apply);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msg.textContent = '確認しています…';
      var pw = input.value.trim();
      var t = await checkTier(pw, checks);
      if (t > 0) { savePw(pw); input.value = ''; var all = await tryAll(getPws()); apply(all); msg.textContent = '開きました。見られる章に鍵がなくなっています。'; }
      else { msg.textContent = 'このパスワードでは開けません。入力のまちがいかもしれません。'; }
    });
    logout.addEventListener('click', function () { clearPws(); apply(0); msg.textContent = 'ログアウトしました。'; });
  };
})();
</script>
<script>AkozaPage(document.getElementById('payload').textContent);</script></body></html>
