      try {
        var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.wraps[i].iv) }, k, b64(d.wraps[i].ct));
        var ck = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, ck, b64(d.ct));
        return dec.decode(pt);
      } catch (e) { /* 次の包みを試す */ }
    }
    return null;
  }
  // 段階の札を開く。合えば段階の番号、違えば 0
  async function checkTier(pw, checks) {
    var best = 0;
    for (var i = 0; i < checks.length; i++) {
      var c = checks[i];
      try {
        var k = await derive(pw, c.salt, c.iter);
        var pt = dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(c.iv) }, k, b64(c.ct)));
        if (pt === 'ok:' + c.tier) best = Math.max(best, c.tier);
      } catch (e) {}
    }
    return best;
  }

  window.AkozaPage = function (payloadText) {
    var d = JSON.parse(payloadText);
    var form = document.getElementById('pwform'), input = document.getElementById('pw'), msg = document.getElementById('msg');
    var lock = document.getElementById('lock'), content = document.getElementById('content');
    function show(html) {
      content.innerHTML = html; content.hidden = false; lock.hidden = true;
      window.scrollTo(0, 0);
    }
    async function tryAll(list) {
      for (var i = 0; i < list.length; i++) {
        var r = await openPage(list[i], d);
        if (r !== null) { savePw(list[i]); show(r); return true; }
      }
      return false;
    }
    tryAll(getPws());
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msg.textContent = '確認しています…';
      var ok = await tryAll([input.value.trim()]);
      if (!ok) { msg.textContent = 'このパスワードでは開けません。段階が違うか、入力のまちがいかもしれません。'; }
    });
  };

  window.AkozaIndex = function (checksText) {
    var checks = JSON.parse(checksText);
    var form = document.getElementById('pwform'), input = document.getElementById('pw'), msg = document.getElementById('msg');
    var logout = document.getElementById('logout'), box = document.getElementById('loginbox');
    function apply(tier) {
      document.querySelectorAll('.chap').forEach(function (el) {
        var need = Number(el.getAttribute('data-tier'));
        var open = tier >= need;
        el.classList.toggle('open', open);
        el.querySelector('.lock').textContent = open ? '' : '🔒';
      });
      logout.hidden = tier === 0;
      if (tier > 0) { msg.textContent = ''; }
    }
    async function tryAll(list) {
      var best = 0;
      for (var i = 0; i < list.length; i++) {
        var t = await checkTier(list[i], checks);
        if (t > 0) { savePw(list[i]); best = Math.max(best, t); }
      }
      return best;
    }
    tryAll(getPws()).then(apply);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msg.textContent = '確認しています…';
      var pw = input.value.trim();
      var t = await checkTier(pw, checks);
      if (t > 0) { savePw(pw); input.value = ''; var all = await tryAll(getPws()); apply(all); msg.textContent = '開きました。見られる章に鍵がなくなっています。'; }
      else { msg.textContent = 'このパスワードでは開けません。入力のまちがいかもしれません。'; }
    });
    logout.addEventListener('click', function () { clearPws(); apply(0); msg.textContent = 'ログアウトしました。'; });
  };
})();
</script>
